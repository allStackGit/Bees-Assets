default_settings:
behaviors:
  Ship:
    trainer_type: poca
    hyperparameters:
      batch_size: 512
      buffer_size: 25600
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
      memory: null
      goal_conditioning_type: hyper
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
        network_settings:
          normalize: false
          hidden_units: 256
          num_layers: 2
          vis_encode_type: simple
          memory: null
          goal_conditioning_type: hyper
    init_path: null
    keep_checkpoints: 5000
    checkpoint_interval: 50000
    max_steps: 1000000000
    time_horizon: 512
    summary_freq: 10000
    threaded: false
    self_play:
      save_steps: 100000
      team_change: 400000
      swap_steps: 50000
      window: 15
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0
    behavioral_cloning: null

  