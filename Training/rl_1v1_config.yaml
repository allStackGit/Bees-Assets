torch_settings:
  device: cpu
behaviors:
  BeesRL1v1:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 16384
      learning_rate: 0.00015
      # Keep a nonzero continual-learning exploration baseline. The Bees PPO
      # compatibility guard caps continuous sigma so entropy cannot destroy
      # directional control even as the curriculum expands.
      beta: 0.001
      epsilon: 0.15
      lambd: 1.0
      num_epoch: 3
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 1.0
        strength: 1.0
    keep_checkpoints: 5000
    checkpoint_interval: 250000
    max_steps: 5000000000000
    time_horizon: 2048
    summary_freq: 5000
    threaded: false
    self_play:
      save_steps: 20000
      team_change: 100000
      swap_steps: 20000
      window: 30
      play_against_latest_model_ratio: 0.20
      initial_elo: 1200.0