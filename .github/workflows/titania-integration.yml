name: Titania integration

on:
  push:
    branches:
      - agent/titania-music

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[titania-integrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/titania-music
          fetch-depth: 0

      - name: Apply Titania map and music contract
        shell: python
        run: |
          from pathlib import Path
          import shutil

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8-sig')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8-sig' if path.endswith('.cs') else 'utf-8')

          # MapIndex is a persisted gameplay contract. Campaign order is now
          # Pluto -> Neptune -> Titania -> Uranus, while Locations enum numeric
          # values stay stable because that is a separate serialized identity.
          replace(
              'Scripts/ConfigData.cs',
              '''            new Data.Map(2, new Vector2(0, -430), new Vector2(0, 430), Locations.Uranus),\n            new Data.Map(3, new Vector2(0, -215), new Vector2(0, 215), Locations.Titania),''',
              '''            new Data.Map(2, new Vector2(0, -215), new Vector2(0, 215), Locations.Titania),\n            new Data.Map(3, new Vector2(0, -430), new Vector2(0, 430), Locations.Uranus),''')

          replace(
              'Scripts/Data/LevelOptions.cs',
              '''        /// 0 = Pluto\n        /// 1 = Uranus''',
              '''        /// 0 = Pluto\n        /// 1 = Neptune\n        /// 2 = Titania\n        /// 3 = Uranus''')

          # Add Titania to the index-based map pool and move Uranus to index 3.
          replace(
              'Scripts/Levels/Pool.cs',
              '''    public ObjectPool<Assets.Scripts.UI_Components.Map> PlutoMapPool;\n    public ObjectPool<Assets.Scripts.UI_Components.Map> NeptuneMapPool;\n    public ObjectPool<Assets.Scripts.UI_Components.Map> UranusMapPool;''',
              '''    public ObjectPool<Assets.Scripts.UI_Components.Map> PlutoMapPool;\n    public ObjectPool<Assets.Scripts.UI_Components.Map> NeptuneMapPool;\n    public ObjectPool<Assets.Scripts.UI_Components.Map> TitaniaMapPool;\n    public ObjectPool<Assets.Scripts.UI_Components.Map> UranusMapPool;''')

          replace(
              'Scripts/Levels/Pool.cs',
              '''        PlutoMapPool = new ObjectPool<Assets.Scripts.UI_Components.Map>(CreatePooledPlutoMap, null, null, null, true);\n        NeptuneMapPool = new ObjectPool<Assets.Scripts.UI_Components.Map>(CreatePooledNeptuneMap, null, null, null, true);\n        UranusMapPool = new ObjectPool<Assets.Scripts.UI_Components.Map>(CreatePooledUranusMap, null, null, null, true);''',
              '''        PlutoMapPool = new ObjectPool<Assets.Scripts.UI_Components.Map>(CreatePooledPlutoMap, null, null, null, true);\n        NeptuneMapPool = new ObjectPool<Assets.Scripts.UI_Components.Map>(CreatePooledNeptuneMap, null, null, null, true);\n        TitaniaMapPool = new ObjectPool<Assets.Scripts.UI_Components.Map>(CreatePooledTitaniaMap, null, null, null, true);\n        UranusMapPool = new ObjectPool<Assets.Scripts.UI_Components.Map>(CreatePooledUranusMap, null, null, null, true);''')

          replace(
              'Scripts/Levels/Pool.cs',
              '''    public Assets.Scripts.UI_Components.Map CreatePooledUranusMap()\n    {\n        return CreatePooledMap(2);\n    }''',
              '''    public Assets.Scripts.UI_Components.Map CreatePooledTitaniaMap()\n    {\n        return CreatePooledMap(2);\n    }\n    public Assets.Scripts.UI_Components.Map CreatePooledUranusMap()\n    {\n        return CreatePooledMap(3);\n    }''')

          replace(
              'Scripts/Levels/Pool.cs',
              '''            case 2:\n                return UranusMapPool.Get();\n            default:''',
              '''            case 2:\n                return TitaniaMapPool.Get();\n            case 3:\n                return UranusMapPool.Get();\n            default:''')

          replace(
              'Scripts/Levels/Pool.cs',
              '''            case 2:\n                UranusMapPool.Release(map);\n                break;\n\n            default:''',
              '''            case 2:\n                TitaniaMapPool.Release(map);\n                break;\n            case 3:\n                UranusMapPool.Release(map);\n                break;\n\n            default:''')

          # Preserve the existing Unity-generated AudioImporter GUID while moving
          # the source track under Resources so code can load it without adding
          # any manually generated .meta files.
          src = Path("Music/Titania/Titania, Uranus' Moon.mp3")
          src_meta = Path("Music/Titania/Titania, Uranus' Moon.mp3.meta")
          dst_dir = Path('Resources/Music/Titania')
          dst_dir.mkdir(parents=True, exist_ok=True)
          if src.exists():
              shutil.move(str(src), str(dst_dir / 'Titania Source.mp3'))
          if src_meta.exists():
              shutil.move(str(src_meta), str(dst_dir / 'Titania Source.mp3.meta'))

          # Update the map contract regression test to the requested ordering.
          replace(
              'Tests/EditMode/TitaniaLocationContractTests.cs',
              '''            AssertMap(maps[2], 2, "Uranus", new Vector2(0, -430), new Vector2(0, 430));\n            AssertMap(maps[3], 3, "Titania", new Vector2(0, -215), new Vector2(0, 215));''',
              '''            AssertMap(maps[2], 2, "Titania", new Vector2(0, -215), new Vector2(0, 215));\n            AssertMap(maps[3], 3, "Uranus", new Vector2(0, -430), new Vector2(0, 430));''')

          # The semantic Locations enum remains stable intentionally. It is not
          # the MapIndex contract and changing its numeric values could reinterpret
          # serialized enum data.

      - name: Add runtime Titania clip splitter
        shell: bash
        run: |
          cat > Scripts/TitaniaMusicBuilder.cs <<'EOF'
          using UnityEngine;

          namespace Assets.Scripts
          {
              /// <summary>
              /// Builds Titania's one-shot intro and seamless looping body from the
              /// full authored source track. The source keeps its Unity-generated
              /// importer metadata; no generated audio .meta files are required.
              /// </summary>
              public static class TitaniaMusicBuilder
              {
                  public const float IntroEndSeconds = 26.565215f;
                  public const float LoopEndSeconds = 185.461179f;
                  public const string ResourcePath = "Music/Titania/Titania Source";

                  private static AudioClip _intro;
                  private static AudioClip _loop;

                  public static bool TryGetClips(out AudioClip intro, out AudioClip loop)
                  {
                      if (_intro != null && _loop != null)
                      {
                          intro = _intro;
                          loop = _loop;
                          return true;
                      }

                      AudioClip source = Resources.Load<AudioClip>(ResourcePath);
                      if (source == null)
                      {
                          Debug.LogError($"Missing Titania music source at Resources/{ResourcePath}");
                          intro = null;
                          loop = null;
                          return false;
                      }

                      int introEnd = Mathf.Clamp(Mathf.RoundToInt(IntroEndSeconds * source.frequency), 1, source.samples);
                      int loopEnd = Mathf.Clamp(Mathf.RoundToInt(LoopEndSeconds * source.frequency), introEnd + 1, source.samples);

                      _intro = CopySegment(source, 0, introEnd, "Titania Intro");
                      _loop = CopySegment(source, introEnd, loopEnd, "Titania Loop");
                      Resources.UnloadAsset(source);

                      intro = _intro;
                      loop = _loop;
                      return true;
                  }

                  private static AudioClip CopySegment(AudioClip source, int startFrame, int endFrame, string name)
                  {
                      int frameCount = endFrame - startFrame;
                      AudioClip result = AudioClip.Create(name, frameCount, source.channels, source.frequency, false);

                      // Copy in short chunks so splitting a long stereo soundtrack does
                      // not allocate one enormous temporary float array.
                      int copiedFrames = 0;
                      int maxChunkFrames = Mathf.Max(1, source.frequency * 2);
                      while (copiedFrames < frameCount)
                      {
                          int chunkFrames = Mathf.Min(maxChunkFrames, frameCount - copiedFrames);
                          float[] data = new float[chunkFrames * source.channels];
                          if (!source.GetData(data, startFrame + copiedFrames))
                          {
                              Object.Destroy(result);
                              throw new System.InvalidOperationException($"Could not read {name} from the Titania source clip.");
                          }
                          if (!result.SetData(data, copiedFrames))
                          {
                              Object.Destroy(result);
                              throw new System.InvalidOperationException($"Could not build runtime clip {name}.");
                          }
                          copiedFrames += chunkFrames;
                      }

                      return result;
                  }
              }
          }
          EOF

      - name: Wire Titania runtime clips into AudioController
        shell: python
        run: |
          from pathlib import Path
          p = Path('Scripts/AudioController.cs')
          text = p.read_text(encoding='utf-8-sig')

          old = '''                case ConfigData.Locations.Titania:\n                    LocationIntro = TitaniaIntro;\n                    LocationLoop = TitaniaLoop;\n                    // Titania currently has only a base location composition. Do not\n                    // accidentally carry faction stems over from the previous location.\n                    HumanLoop = null;\n                    BeesLoop = null;\n                    IntroLength = TitaniaIntroLength;\n                    break;'''
          new = '''                case ConfigData.Locations.Titania:\n                    EnsureTitaniaMusicSources();\n                    LocationIntro = TitaniaIntro;\n                    LocationLoop = TitaniaLoop;\n                    // Titania currently has only a base location composition. Do not\n                    // accidentally carry faction stems over from the previous location.\n                    HumanLoop = null;\n                    BeesLoop = null;\n                    IntroLength = TitaniaIntro != null ? TitaniaIntro.clip.length : TitaniaIntroLength;\n                    break;'''
          if old not in text:
              raise SystemExit('Titania AudioController switch block not found')
          text = text.replace(old, new)

          marker = '''        private static void AddIfPresent(List<AudioSource> sources, AudioSource source)\n        {'''
          method = '''        private void EnsureTitaniaMusicSources()\n        {\n            if (!TitaniaMusicBuilder.TryGetClips(out AudioClip introClip, out AudioClip loopClip))\n            {\n                TitaniaIntro = null;\n                TitaniaLoop = null;\n                return;\n            }\n\n            AudioSource template = PlutoLoop != null ? PlutoLoop : PlutoIntro;\n            TitaniaIntro = EnsureMusicSource(TitaniaIntro, "Titania Intro", template);\n            TitaniaLoop = EnsureMusicSource(TitaniaLoop, "Titania Loop", template);\n            TitaniaIntro.clip = introClip;\n            TitaniaIntro.loop = false;\n            TitaniaLoop.clip = loopClip;\n            TitaniaLoop.loop = true;\n            TitaniaIntroLength = introClip.length;\n        }\n\n        private AudioSource EnsureMusicSource(AudioSource source, string sourceName, AudioSource template)\n        {\n            if (source == null)\n            {\n                source = gameObject.AddComponent<AudioSource>();\n            }\n            source.playOnAwake = false;\n            source.spatialBlend = 0f;\n            source.name = sourceName;\n            if (template != null)\n            {\n                source.outputAudioMixerGroup = template.outputAudioMixerGroup;\n                source.volume = template.volume;\n                source.priority = template.priority;\n            }\n            return source;\n        }\n\n'''
          if marker not in text:
              raise SystemExit('AudioController insertion marker not found')
          text = text.replace(marker, method + marker)
          p.write_text(text, encoding='utf-8-sig')

      - name: Update repository learning memory
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/AUDIO_MEMORY.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '- `LevelOptions.MapIndex`/`ConfigData.Maps` is a persisted gameplay/data contract, not just an inspector list. Preserve **0 Pluto, 1 Neptune, 2 Uranus, 3 Titania**. Do not move Uranus from index 2 merely because Titania missions occur before Uranus in campaign order.',
              '- `LevelOptions.MapIndex`/`ConfigData.Maps` is a persisted gameplay/data contract, not just an inspector list. The current authoritative order is **0 Pluto, 1 Neptune, 2 Titania, 3 Uranus**. `ConfigData.Locations` is a separate semantic enum and deliberately keeps its older numeric values stable; do not assume Location enum numbers equal MapIndex values.')
          text = text.replace(
              '- `Space.unity` currently serializes `Prefabs.Maps` as Pluto, Neptune, Titania, Uranus. `Stage.FinalizeSceneWithUserData()` calls `Prefabs.LoadConversions()` before `Pool.Setup()`, so runtime code normalizes map prefabs by prefab name into `ConfigData.Maps` order before the index-based map pool is used. This removes inspector ordering as a hidden MapIndex dependency.',
              '- `Space.unity` serializes `Prefabs.Maps` as Pluto, Neptune, Titania, Uranus, which now matches the authoritative MapIndex order. `Stage.FinalizeSceneWithUserData()` still calls `Prefabs.LoadConversions()` before `Pool.Setup()`, and runtime normalization by prefab name remains a fail-closed guard against future inspector reordering.')
          text = text.replace(
              '- Deliver the split clips as PCM WAV (`Titania Intro.wav` and `Titania Loop.wav`) rather than re-encoding the loop as MP3. Sample-accurate WAV boundaries avoid MP3 encoder-delay/padding becoming an audible gap or click when Unity\'s `AudioSource.loop` wraps.\n- Unity `.meta` files for the generated clips must be generated by Unity, not fabricated remotely. Only after Unity assigns their real GUIDs should `Prefabs/UI/Audio.prefab` serialize the Titania intro/loop clip references. Titania\'s loop source should have `Loop: 1`; its intro source should not loop.',
              '- Titania keeps the full authored source as a single Unity-imported resource and builds two runtime PCM `AudioClip`s at the analyzed sample boundaries. This gives the same one-shot-intro + true `AudioSource.loop` behavior as the other maps without re-encoding the loop or inventing `.meta` GUIDs. The existing source `.meta` is moved with the asset into `Resources/Music/Titania`, so Unity remains the metadata authority.\n- `TitaniaMusicBuilder` copies in bounded chunks, then unloads the full source asset after constructing the shorter intro/loop clips. Titania currently has no Human/Bees stems; those remain intentionally null.')
          p.write_text(text, encoding='utf-8')

      - name: Static contract validation
        shell: python
        run: |
          from pathlib import Path
          config = Path('Scripts/ConfigData.cs').read_text(encoding='utf-8-sig')
          pool = Path('Scripts/Levels/Pool.cs').read_text(encoding='utf-8-sig')
          audio = Path('Scripts/AudioController.cs').read_text(encoding='utf-8-sig')
          assert 'new Data.Map(2, new Vector2(0, -215), new Vector2(0, 215), Locations.Titania)' in config
          assert 'new Data.Map(3, new Vector2(0, -430), new Vector2(0, 430), Locations.Uranus)' in config
          assert 'CreatePooledTitaniaMap' in pool and 'return CreatePooledMap(3);' in pool
          assert 'TitaniaMusicBuilder.TryGetClips' in audio
          assert Path('Resources/Music/Titania/Titania Source.mp3').exists()
          assert Path('Resources/Music/Titania/Titania Source.mp3.meta').exists()

      - name: Commit integration
        shell: bash
        run: |
          git config user.name "ChatGPT repository agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No integration changes required"
            exit 0
          fi
          git commit -m "[titania-integrated] Complete Titania music and map contract"
          git push origin HEAD:agent/titania-music
