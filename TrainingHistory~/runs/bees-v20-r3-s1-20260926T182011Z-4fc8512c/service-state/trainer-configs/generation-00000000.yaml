torch_settings:
  device: cpu
behaviors:
  BeesRL1v1:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 16384
      learning_rate: 0.0003
      # Fixed entropy pressure. Adaptive beta is disabled; change this value
      # manually between runs/checkpoint resumes if entropy needs correction.
      # Continuous sigma remains hard-capped separately.
      beta: 0.00125
      epsilon: 0.15
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 1.0
        strength: 1.0
    keep_checkpoints: 250
    checkpoint_interval: 2000000
    max_steps: 1000000
    time_horizon: 2048
    summary_freq: 5000
    threaded: false
    self_play:
      save_steps: 20000
      team_change: 100000
      swap_steps: 20000
      window: 30
      play_against_latest_model_ratio: 0.20
      initial_elo: 1200.0