[package]
name = "bees-hivemind"
version = "0.1.0"
edition.workspace = true
publish = false

# Wire compatibility, request ownership and outcome settlement only.
# The authoritative shared game simulation remains bees-sim. Actual
# networking, authentication and durable learning persistence belong to
# the native client/server adapters, not this pure contract crate.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
