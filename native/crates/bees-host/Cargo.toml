[package]
name = "bees-host"
version = "0.1.0"
edition.workspace = true
publish = false

# OS-backed adapters shared by the rendered client and headless worker.
# Neither gameplay nor the HiveMind protocol crate depends on the host.
[dependencies]
bees-hivemind = { path = "../bees-hivemind" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
bees-gameplay = { path = "../bees-gameplay" }
bees-sim = { path = "../bees-sim" }

# Zero-copy byte views for little-endian contiguous v26 model rows.
bytemuck = "1"

# One cross-platform blocking WSS transport; the app owns its I/O thread.
# Rustls verifies normal certificate chains (never insecure TLS fallback).
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
