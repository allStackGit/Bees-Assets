[package]
name = "bees-host"
version = "0.1.0"
edition.workspace = true
publish = false

[features]
default = []
# The headless build never links a window system. Linux uses X11.
client = ["dep:minifb"]

# OS-backed adapters shared by the rendered client and headless worker.
# Neither gameplay nor the HiveMind protocol crate depends on the host.
[dependencies]
bees-hivemind = { path = "../bees-hivemind" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
bees-gameplay = { path = "../bees-gameplay" }
bees-sim = { path = "../bees-sim" }

# Zero-copy byte views for little-endian contiguous v26 model rows.
bytemuck = "1"

# One cross-platform blocking WSS transport; the app owns its I/O thread.
# Rustls verifies normal certificate chains (never insecure TLS fallback).
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# Tungstenite disables rustls defaults: without a crypto provider, the first
# WSS connection panics while constructing ClientConfig, before TLS handshake.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }

# OS cryptographic entropy for the one persisted 21-bit socket identity.
getrandom = "0.2"

# Manifest-time SHA-256 of real model weights, not an alternate policy ID.
sha2 = "0.10"

minifb = { version = "0.29", optional = true, default-features = false, features = ["x11"] }
