[package]
name = "bees-sim"
version = "0.1.0"
edition.workspace = true
publish = false

# No presentation, ML, operating-system, or network dependency.
# The game client and headless worker will both link this core.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "=1.11.0"
